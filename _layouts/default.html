<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
		<title>{% if page.title %}{{ page.title }} - {% endif %}tgergo1</title>
		<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}tgergo1.github.io{% endif %}">
		<meta name="author" content="Gergely Várhelyi-Tóth">
		<link rel="icon" href="{{ '/img/favicon.ico' | relative_url }}">
		<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.13/css/all.css" integrity="sha384-DNOHZ68U8hZfKXOrtjWvjxusGo9WQnrNx2sqG0tfsghAvtVlRW3tvkXWZh58N9jp" crossorigin="anonymous">
		<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
	</head>
	<body{% if page.dark_mode %} class="dark-mode"{% endif %}>
		<nav class="topnav">
			<a href="{{ '/' | relative_url }}">Home</a>
			<a href="{{ '/blog/' | relative_url }}">Blog</a>
			<a href="{{ '/microblog/' | relative_url }}">Microblog</a>
			<a href="{{ '/projects/' | relative_url }}">Projects</a>
			<a href="{{ '/now/' | relative_url }}">Now</a>
			<a href="{{ '/reading/' | relative_url }}">Reading</a>
			<a href="{{ '/tools/' | relative_url }}">Tools</a>
			<a href="{{ '/resume/' | relative_url }}">Resume</a>
			<button id="dark-mode-toggle" class="dark-mode-btn" aria-label="Toggle dark mode">
				<i class="fas fa-moon"></i>
			</button>
		</nav>
		
		{{ content }}
		
		<script>
			document.querySelectorAll('.topnav a[href^="#"]').forEach(anchor => {
				anchor.addEventListener('click', function (e) {
					e.preventDefault();
					document.querySelector(this.getAttribute('href')).scrollIntoView({
						behavior: 'smooth'
					});
				});
			});
			
			// Dark mode toggle
			const darkModeToggle = document.getElementById('dark-mode-toggle');
			const body = document.body;
			const icon = darkModeToggle.querySelector('i');
			
			// Check for saved dark mode preference
			const darkMode = localStorage.getItem('darkMode');
			if (darkMode === 'enabled') {
				body.classList.add('dark-mode');
				icon.classList.remove('fa-moon');
				icon.classList.add('fa-sun');
			}
			
			darkModeToggle.addEventListener('click', () => {
				body.classList.toggle('dark-mode');
				
				if (body.classList.contains('dark-mode')) {
					localStorage.setItem('darkMode', 'enabled');
					icon.classList.remove('fa-moon');
					icon.classList.add('fa-sun');
				} else {
					localStorage.setItem('darkMode', null);
					icon.classList.remove('fa-sun');
					icon.classList.add('fa-moon');
				}
			});
		</script>
	</body>
</html>
