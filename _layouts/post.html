---
layout: default
---

<div class="blog-container">
	<article class="blog-post-single">
		<div class="post-header">
			<img src="{{ '/img/avatar.jpg' | relative_url }}" alt="Gergely Várhelyi-Tóth" class="post-avatar">
			<div class="post-meta">
				<h2 class="post-author">Gergely Várhelyi-Tóth</h2>
				<time class="post-date">{{ page.date | date: "%B %d, %Y" }}</time>
			</div>
		</div>
		
		<h1 class="post-title">{{ page.title }}</h1>
		
		{% if page.image %}
		<div class="post-image-container">
			<img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="post-image">
		</div>
		{% endif %}
		
		<div class="post-content">
			{{ content }}
		</div>
		
		{% if page.tags %}
		<div class="post-tags">
			{% for tag in page.tags %}
			<span class="tag">#{{ tag }}</span>
			{% endfor %}
		</div>
		{% endif %}
		
		<div class="post-actions">
			<a href="{{ '/blog/' | relative_url }}" class="back-link">← Back to Blog</a>
		</div>
	</article>
</div>
